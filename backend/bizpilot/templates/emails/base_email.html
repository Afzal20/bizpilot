<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BizPilot Notification{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #0b0f19;
      padding: 40px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .header {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      padding: 32px 36px;
      border-bottom: 1px solid #1e293b;
      text-align: center;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-decoration: none;
    }
    .logo-accent {
      color: #6366f1;
    }
    .content {
      padding: 36px;
      line-height: 1.6;
      font-size: 15px;
      color: #cbd5e1;
    }
    .footer {
      padding: 24px 36px;
      background-color: #0f172a;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
    .footer a {
      color: #818cf8;
      text-decoration: none;
    }
    .btn {
      display: inline-block;
      background-color: #6366f1;
      color: #ffffff !important;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-success {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .badge-info {
      background-color: rgba(99, 102, 241, 0.15);
      color: #818cf8;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .data-table th {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }
    .data-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #1e293b;
      color: #f1f5f9;
    }
    .total-row td {
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      border-top: 2px solid #334155;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <span class="logo-text">Biz<span class="logo-accent">Pilot</span></span>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p>&copy; 2026 BizPilot ERP. All rights reserved.</p>
        <p>You received this automated message regarding your BizPilot account or transaction.</p>
      </div>
    </div>
  </div>
</body>
</html>
